# ci.yml

# ML Framework CI Pipeline
name: Small ML Library CI Pipeline

# Makes workflow run on pull and push
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Jobs
jobs:
  linux_test:
    runs-on: ubuntu-latest
    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure CMake
      - name: Configure CMake
        run:
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # Build project
      - name: Build project
        run:
          cmake --build build --config RelWithDebInfo

      # Run unit tests
      - name: Run unit tests
        run:
          ctest --test-dir build --output-on-failure -C RelWithDebInfo