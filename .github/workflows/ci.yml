# ci.yml

# ML Framework CI Pipeline
name: Small ML Library CI Pipeline

# Makes workflow run on pull and push
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Jobs
jobs:
  linux_test:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure CMake
      - name: Configure CMake
        run:
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      # Build project
      - name: Build project
        run:
          cmake --build build --config Release

      # Run unit tests
      - name: Run unit tests
        run:
          ctest --test-dir build --output-on-failure -C Release

  linux_test_sanitized:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure with sanitizers
      - name: Configure CMake with sanitizers
        run: |
          cmake -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
        
      # Build sanitizer configuration
      - name: Build sanitizer configuration
        run: |
          cmake --build build-sanitize

      # Run sanitizer tests
      - name: Run sanitizer tests
        run: | 
          ctest --test-dir build-sanitize --output-on-failure

      